name = "sxrveshlabs-runner"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

[vars]
ENVIRONMENT = "production"

# In production Cloudflare Workers / Pages Functions:
# Set confidential secrets via:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put RUNNER_SIGNING_SECRET
# Public client variables (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)
# can be set in Cloudflare Pages build environment variables.
